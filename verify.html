<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Verify your email to activate your EXPLICIT account.">
  <title>Verify Email | EXPLICIT</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <div class="header-inner">
      <a class="wordmark" href="index.html">EXPLICIT</a>
      <a class="auth-back" href="index.html">Back to collection</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-intro" aria-labelledby="verify-title">
      <p class="eyebrow mono">EXPLICIT / Account</p>
      <h1 id="verify-title">CONFIRM IT.</h1>
      <p>One last step. Enter the code we sent to unlock your account.</p>
    </section>

    <section class="auth-form-wrap" aria-labelledby="verify-form-title">
      <h2 id="verify-form-title">Verify.</h2>
      <p class="auth-form-intro">We emailed a 6-digit code to <strong id="verifyEmail"></strong>.</p>
      <form class="auth-form" id="verifyForm" novalidate>
        <div class="auth-field">
          <label for="verify-code">Verification code</label>
          <input id="verify-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
        </div>
        <p class="auth-error" role="alert" aria-live="polite"></p>
        <button class="button" type="submit">Verify email <span>↗</span></button>
        <button class="auth-resend" type="button" id="resendButton">Didn't get it? Resend code</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase.js" defer></script>
  <script src="verify.js" defer></script>
</body>
</html>
